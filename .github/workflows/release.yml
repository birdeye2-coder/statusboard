name: release

on:
  push:
    tags: ["v*"]

jobs:
  push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/birdeye2-coder/statusboard-api:${{ github.ref_name }}
            ghcr.io/birdeye2-coder/statusboard-api:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/birdeye2-coder/statusboard-web:${{ github.ref_name }}
            ghcr.io/birdeye2-coder/statusboard-web:latest
